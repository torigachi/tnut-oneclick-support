name: TNUT Auto Crawler

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng
  workflow_dispatch: # Cho phép bấm chạy bằng tay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Cài đặt thư viện & Trình duyệt ảo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Chạy Bot Cào Dữ Liệu
        run: python crawler.py
        
      - name: Đẩy dữ liệu mới lên Web
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Auto-update: Lấy tin tức mới từ Web, Portal & Facebook" || exit 0
          git push
